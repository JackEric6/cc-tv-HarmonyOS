name: Build HarmonyOS HAP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Set up HarmonyOS SDK
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721
        with:
          version: 6.1.1.280
          cache: false

      - name: Show build environment
        run: |
          hvigorw -v
          ohpm -v

      - name: Prepare HarmonyOS signing materials
        env:
          OHOS_STORE_BASE64: ${{ secrets.OHOS_STORE_BASE64 }}
          OHOS_STORE_PASSWORD: ${{ secrets.OHOS_STORE_PASSWORD }}
          OHOS_KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
          OHOS_PROFILE_BASE64: ${{ secrets.OHOS_PROFILE_BASE64 }}
          OHOS_CERT_BASE64: ${{ secrets.OHOS_CERT_BASE64 }}
        run: |
          set -euo pipefail
          for name in OHOS_STORE_BASE64 OHOS_STORE_PASSWORD OHOS_KEY_ALIAS OHOS_KEY_PASSWORD OHOS_PROFILE_BASE64 OHOS_CERT_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

          export OHOS_SIGN_DIR="$RUNNER_TEMP/cc-tv-signing"
          mkdir -p "$OHOS_SIGN_DIR"
          printf '%s' "$OHOS_STORE_BASE64" | base64 --decode > "$OHOS_SIGN_DIR/release.p12"
          printf '%s' "$OHOS_PROFILE_BASE64" | base64 --decode > "$OHOS_SIGN_DIR/profile.p7b"
          printf '%s' "$OHOS_CERT_BASE64" | base64 --decode > "$OHOS_SIGN_DIR/release.cer"

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const profilePath = 'build-profile.json5';
          const profile = JSON.parse(fs.readFileSync(profilePath, 'utf8'));
          const signing = profile.app.signingConfigs.find((item) => item.name === 'default');
          if (!signing) throw new Error('Missing default HarmonyOS signing config');
          signing.material = {
            ...signing.material,
            storeFile: path.join(process.env.OHOS_SIGN_DIR, 'release.p12'),
            storePassword: process.env.OHOS_STORE_PASSWORD,
            keyAlias: process.env.OHOS_KEY_ALIAS,
            keyPassword: process.env.OHOS_KEY_PASSWORD,
            signAlg: 'SHA256withECDSA',
            profile: path.join(process.env.OHOS_SIGN_DIR, 'profile.p7b'),
            certpath: path.join(process.env.OHOS_SIGN_DIR, 'release.cer')
          };
          fs.writeFileSync(profilePath, `${JSON.stringify(profile, null, 2)}\n`);
          NODE

      - name: Build signed HAP
        run: hvigorw --no-daemon assembleHap

      - name: Verify signed HAP
        run: |
          mapfile -t signed_haps < <(find entry/build/default/outputs/default -maxdepth 1 -type f -name '*-signed.hap' -print)
          if [[ ${#signed_haps[@]} -eq 0 ]]; then
            echo "::error::Build completed without producing a signed HAP"
            exit 1
          fi
          for hap in "${signed_haps[@]}"; do
            test -s "$hap"
            sha256sum "$hap"
          done

      - name: Upload signed HAP
        uses: actions/upload-artifact@v4
        with:
          name: harmonyos-hap-signed
          path: entry/build/default/outputs/default/*-signed.hap
          if-no-files-found: error

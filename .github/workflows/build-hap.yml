name: Build HarmonyOS HAP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare HarmonyOS test signing materials
        env:
          OHOS_STORE_BASE64: ${{ secrets.OHOS_STORE_BASE64 }}
          OHOS_STORE_PASSWORD: ${{ secrets.OHOS_STORE_PASSWORD }}
          OHOS_KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
          OHOS_PROFILE_BASE64: ${{ secrets.OHOS_PROFILE_BASE64 }}
          OHOS_CERT_BASE64: ${{ secrets.OHOS_CERT_BASE64 }}
        run: |
          set -euo pipefail
          for name in OHOS_STORE_BASE64 OHOS_STORE_PASSWORD OHOS_KEY_ALIAS OHOS_KEY_PASSWORD OHOS_PROFILE_BASE64 OHOS_CERT_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

          mkdir -p "$RUNNER_TEMP/cc-tv-signing"
          printf '%s' "$OHOS_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cc-tv-signing/keystore.p12"
          printf '%s' "$OHOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/cc-tv-signing/profile.p7b"
          printf '%s' "$OHOS_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cc-tv-signing/certificate.cer"

      - name: Install Linux build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Set up HarmonyOS SDK
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721
        with:
          version: 6.1.1.280
          cache: false

      - name: Show build environment
        run: |
          hvigorw -v
          ohpm -v

      - name: Configure unsigned HAP build
        run: |
          node <<'NODE'
          const fs = require('fs');
          const profilePath = 'build-profile.json5';
          const profile = JSON.parse(fs.readFileSync(profilePath, 'utf8'));
          delete profile.app.signingConfigs;
          for (const product of profile.app.products ?? []) delete product.signingConfig;
          fs.writeFileSync(profilePath, `${JSON.stringify(profile, null, 2)}\n`);
          NODE

      - name: Build unsigned HAP
        run: hvigorw --no-daemon assembleHap

      - name: Sign HAP with test profile
        env:
          OHOS_STORE_PASSWORD: ${{ secrets.OHOS_STORE_PASSWORD }}
          OHOS_KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mapfile -t unsigned_haps < <(find entry/build/default/outputs/default -maxdepth 1 -type f -name '*.hap' ! -name '*-signed.hap' -print)
          if [[ ${#unsigned_haps[@]} -ne 1 ]]; then
            echo "::error::Expected one unsigned HAP, found ${#unsigned_haps[@]}"
            exit 1
          fi

          sign_tool="$(find "$HOS_SDK_HOME" -type f -name 'hap-sign-tool.jar' -print -quit)"
          if [[ -z "$sign_tool" ]]; then
            echo "::error::HarmonyOS hap-sign-tool.jar was not found in the installed SDK"
            exit 1
          fi

          java -jar "$sign_tool" sign-app \
            -mode localSign \
            -keystoreFile "$RUNNER_TEMP/cc-tv-signing/keystore.p12" \
            -keystorePwd "$OHOS_STORE_PASSWORD" \
            -keyAlias "$OHOS_KEY_ALIAS" \
            -keyPwd "$OHOS_KEY_PASSWORD" \
            -signAlg SHA256withECDSA \
            -profileFile "$RUNNER_TEMP/cc-tv-signing/profile.p7b" \
            -appCertFile "$RUNNER_TEMP/cc-tv-signing/certificate.cer" \
            -inFile "${unsigned_haps[0]}" \
            -signCode 1 \
            -outFile entry/build/default/outputs/default/entry-default-signed.hap

      - name: Verify signed HAP signature
        run: |
          signed_hap=entry/build/default/outputs/default/entry-default-signed.hap
          if [[ ! -s "$signed_hap" ]]; then
            echo "::error::Build completed without producing a non-empty signed HAP"
            exit 1
          fi

          sign_tool="$(find "$HOS_SDK_HOME" -type f -name 'hap-sign-tool.jar' -print -quit)"
          java -jar "$sign_tool" verify-app \
            -inFile "$signed_hap" \
            -outCertChain "$RUNNER_TEMP/cc-tv-signing/verified-cert-chain.pem" \
            -outProfile "$RUNNER_TEMP/cc-tv-signing/verified-profile.p7b"
          sha256sum "$signed_hap"

      - name: Upload signed HAP
        uses: actions/upload-artifact@v4
        with:
          name: harmonyos-hap-signed
          path: entry/build/default/outputs/default/entry-default-signed.hap
          if-no-files-found: error
